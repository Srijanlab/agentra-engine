services:
  agentos:
    build: .
    image: agentos:local

    # ── Volumes ────────────────────────────────────────────────────────────────
    volumes:
      # Target repo (required). Set REPO_PATH in your shell or .env file.
      # The agents read/write code and run git here — changes are real and
      # persistent on the host, which is intentional.
      - ${REPO_PATH:?Set REPO_PATH to the absolute path of the target repo}:/workspace

      # Named volume for the Claude CLI's config dir (OAuth token cache,
      # session state, etc.). Persists across container restarts so you don't
      # have to re-auth on every run.
      - claude-home:/home/agentuser/.claude

    # ── Auth (pick one) ────────────────────────────────────────────────────────
    environment:
      # OPTION A — OAuth access token (recommended for containers).
      # The claude CLI reads this env var before checking the credentials file.
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}

      # OPTION B — API key (alternative to OAuth).
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

      # ── Git identity (needed for git commits inside the container) ────────────
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-agentos-bot}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-agentos@localhost}
      - GIT_COMMITTER_NAME=${GIT_AUTHOR_NAME:-agentos-bot}
      - GIT_COMMITTER_EMAIL=${GIT_AUTHOR_EMAIL:-agentos@localhost}

      # ── Deployment tool tokens (optional; only needed by Deployment Agent) ────
      - VERCEL_TOKEN=${VERCEL_TOKEN:-}
      - FIREBASE_TOKEN=${FIREBASE_TOKEN:-}

    # ── Network ────────────────────────────────────────────────────────────────
    # Outbound internet is required (Claude API + git push + Vercel/Firebase).
    # No inbound ports are exposed — the container is purely a worker.
    network_mode: bridge

    # ── Safety ─────────────────────────────────────────────────────────────────
    # Drop all Linux capabilities; agents don't need any.
    cap_drop:
      - ALL
    # Read-only root filesystem except for explicitly-writable paths.
    # /workspace and /home/agentuser/.claude are writable via volumes.
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777   # npm, pip, claude CLI temp files

volumes:
  claude-home:
