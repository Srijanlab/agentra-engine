services:
  agentra:
    build: .
    image: agentra:local

    # ── Volumes ────────────────────────────────────────────────────────────────
    volumes:
      # Target repo (required). Set REPO_PATH in your shell or .env file.
      # The agents read/write code and run git here — changes are real and
      # persistent on the host, which is intentional.
      - ${REPO_PATH:?Set REPO_PATH to the absolute path of the target repo}:/workspace

      # Named volume for the Claude CLI's config dir (OAuth token cache,
      # session state, etc.). Persists across container restarts so you don't
      # have to re-auth on every run.
      - claude-home:/home/agentuser/.claude

      # Named volume for agentra's own multi-app registry + durable inbox
      # (agentra/registry.py). Without this, every --rm container run starts
      # with a blank registry -- registered apps and any not-yet-dispatched
      # inbox requests would silently vanish between runs.
      - agentra-home:/home/agentuser/.agentra

    # ── Auth (pick one) ────────────────────────────────────────────────────────
    environment:
      # OPTION A — OAuth access token (recommended for containers).
      # The claude CLI reads this env var before checking the credentials file.
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}

      # OPTION B — API key (alternative to OAuth).
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

      # NIM proxy endpoint. Only used when the dashboard's Model Backend toggle
      # is set to "nim" (agentra/agents/base.py:_sdk_env). Harmless otherwise.
      - NIM_PROXY_URL=http://agentra-nim-nginx

      # ── Git identity (needed for git commits inside the container) ────────────
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-agentra-bot}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-rossharma1@gmail.com}
      - GIT_COMMITTER_NAME=${GIT_AUTHOR_NAME:-agentra-bot}
      - GIT_COMMITTER_EMAIL=${GIT_AUTHOR_EMAIL:-rossharma1@gmail.com}

      # ── Deployment tool tokens (optional; only needed by Deployment Agent) ────
      - VERCEL_TOKEN=${VERCEL_TOKEN:-}
      - FIREBASE_TOKEN=${FIREBASE_TOKEN:-}

    # ── Network ────────────────────────────────────────────────────────────────
    # Outbound internet is required (Claude API + git push + Vercel/Firebase).
    # No inbound ports are exposed — the container is purely a worker. The
    # user-defined network also lets it resolve the nim-proxy/nim-nginx
    # containers by name.
    networks:
      - agentra-net

    # ── Safety ─────────────────────────────────────────────────────────────────
    # Drop all Linux capabilities; agents don't need any.
    cap_drop:
      - ALL
    # Read-only root filesystem except for explicitly-writable paths.
    # /workspace, /home/agentuser/.claude, and /home/agentuser/.agentra are
    # writable via volumes.
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777   # npm, pip, claude CLI temp files

  # ── NIM proxy (optional) ─────────────────────────────────────────────────────
  # Reached only when the dashboard's Model Backend toggle selects "nim".
  # Same image as agentra, run with a different entrypoint.
  nim-proxy:
    build: .
    image: agentra:local
    container_name: agentra-nim-proxy
    entrypoint: ["uvicorn", "agentra.proxy.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NIM_MODEL=${NIM_MODEL:-meta/llama-3.2-90b-vision-instruct}
    networks:
      - agentra-net

  nim-nginx:
    image: nginx:alpine
    container_name: agentra-nim-nginx
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nim-proxy
    networks:
      - agentra-net

volumes:
  claude-home:
  agentra-home:

networks:
  agentra-net:
