name: ci
on:
  push:
    branches: [main, beta]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: find agentra -name '*.py' -print0 | xargs -0 -n1 python -m py_compile
      - run: pytest tests
