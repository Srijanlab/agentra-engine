name: image

# Build the engine image and push it to GHCR. Host-agnostic — whatever runs
# agentra-engine (Fly / Oracle / a box) pulls from here. GCP billing is closed,
# so no Cloud Build / Artifact Registry / Cloud Run.
#
#   push to beta -> ghcr.io/srijanlab/agentra-engine:preprod  (+ :sha)
#   push to main -> ghcr.io/srijanlab/agentra-engine:prod      (+ :sha, :latest)

on:
  push:
    branches: [beta, main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tags
        id: tags
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMG=ghcr.io/${OWNER}/agentra-engine
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tags=${IMG}:prod,${IMG}:latest,${IMG}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMG}:preprod,${IMG}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### image pushed"
            echo ""
            echo '```'
            echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
