name: deploy

# Pre-prod deploy happens on merge to `beta`; prod on merge to `main`.
# Both target Cloud Run in the same project, as two separate services:
#   beta -> agentra-engine-preprod   (the URL the Testing Agent verifies)
#   main -> agentra-engine           (production)
# The Deployment Agent (in agentra-loop) merges the feature branch to `beta`,
# then watches this workflow run (AGENTRA_CI_CD_ON_PUSH=true).

on:
  push:
    branches: [beta, main]
  workflow_dispatch:
    inputs:
      target:
        description: preprod | prod
        required: true
        default: preprod

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # Workload Identity Federation

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preflight — skip cleanly until GCP is configured
        id: cfg
        run: |
          if [ -z "${{ vars.GCP_PROJECT }}" ] || [ -z "${{ vars.WIF_PROVIDER }}" ]; then
            echo "::notice::agentra-engine deploy is not configured yet — run deploy/cloudrun/README.md's setup, then re-run."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve target
        if: steps.cfg.outputs.ready == 'true'
        id: t
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TGT="${{ inputs.target }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            TGT="prod"
          else
            TGT="preprod"
          fi
          if [ "$TGT" = "prod" ]; then SVC="agentra-engine"; else SVC="agentra-engine-preprod"; fi
          echo "target=$TGT" >> "$GITHUB_OUTPUT"
          echo "service=$SVC" >> "$GITHUB_OUTPUT"
          echo "image=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/agentra/${SVC}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v2
        if: steps.cfg.outputs.ready == 'true'
        with:
          project_id: ${{ vars.GCP_PROJECT }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.cfg.outputs.ready == 'true'

      - name: Build image (Cloud Build)
        if: steps.cfg.outputs.ready == 'true'
        # regional-user-owned-bucket: logs go to a bucket the deploy SA owns, so
        # `builds submit` can stream them without project Viewer on the SA.
        run: |
          gcloud builds submit . \
            --tag "${{ steps.t.outputs.image }}" \
            --project "${{ vars.GCP_PROJECT }}" \
            --region "${{ vars.GCP_REGION }}" \
            --default-buckets-behavior regional-user-owned-bucket

      - name: Deploy to Cloud Run
        if: steps.cfg.outputs.ready == 'true'
        id: deploy
        run: |
          gcloud run deploy "${{ steps.t.outputs.service }}" \
            --image "${{ steps.t.outputs.image }}" \
            --project "${{ vars.GCP_PROJECT }}" \
            --region "${{ vars.GCP_REGION }}" \
            --service-account "${{ vars.RUNTIME_SA }}" \
            --min-instances 0 --max-instances 4 \
            --cpu 1 --memory 512Mi --timeout 120 \
            --set-env-vars "AGENTRA_FIRESTORE_PROJECT=${{ vars.GCP_PROJECT }},AGENTRA_ENV=${{ steps.t.outputs.target }}" \
            --set-secrets "GITHUB_APP_ID=agentra-github-app-id:latest,GITHUB_APP_PRIVATE_KEY=agentra-github-app-private-key:latest,GITHUB_TOKEN=agentra-github-token:latest,SLACK_SIGNING_SECRET=agentra-slack-signing-secret:latest,SLACK_BOT_TOKEN=agentra-slack-bot-token:latest,AGENTRA_ALARM_WEBHOOK_PASSWORD=agentra-alarm-webhook-password:latest" \
            --no-allow-unauthenticated \
            --quiet
          URL=$(gcloud run services describe "${{ steps.t.outputs.service }}" --project "${{ vars.GCP_PROJECT }}" --region "${{ vars.GCP_REGION }}" --format 'value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: steps.cfg.outputs.ready == 'true'
        run: |
          {
            echo "### ${{ steps.t.outputs.target }} deploy"
            echo ""
            echo "- service: \`${{ steps.t.outputs.service }}\`"
            echo "- image: \`${{ steps.t.outputs.image }}\`"
            echo "- url: ${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
