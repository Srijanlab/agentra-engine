[project]
name = "agentra"
version = "0.1.0"
description = "Autonomous product engineering agent system"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.110",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "google-cloud-firestore>=2.19",
]

[project.optional-dependencies]
# The loop's workloads — screenshots (Testing Agent) and the codebase graph.
# Not installed in the engine image; the engine never runs these.
agents = [
    "playwright>=1.48",
    "graphifyy[mcp]>=0.9.46",
]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.6",
    "google-cloud-texttospeech>=2.16",
    "playwright>=1.48",
    "graphifyy[mcp]>=0.9.46",
]

[project.scripts]
agentra = "agentra.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentra*"]

[tool.pytest.ini_options]
# -n auto: parallelize across all available cores by default (pytest-xdist) --
# the suite is dominated by subprocess-heavy integration tests (real git,
# docker, graphify tree-sitter calls, not pure in-memory unit tests), which
# is exactly the workload that benefits most from real parallelism rather
# than sequential wall-clock time. Applies automatically to every `pytest`
# invocation (agent or human) without needing -n auto typed out each time --
# no separate CI config or Makefile target to keep in sync.
addopts = "-n auto"
