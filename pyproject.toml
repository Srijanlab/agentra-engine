[project]
name = "agentra"
version = "0.1.0"
description = "Autonomous product engineering agent system"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.110",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
agentra = "agentra.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentra*"]
